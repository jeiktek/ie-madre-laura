<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada — Institución Educativa Madre Laura</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('madre-laura-tema');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
    <site-header></site-header>
    <main id="contenido">
      <div class="container section">
        <p class="eyebrow">Error 404</p>
        <h1>Página no encontrada</h1>
        <div class="prose">
          <p>
            La dirección solicitada no existe o fue movida. Puedes volver al inicio o
            revisar las secciones de la institución.
          </p>
          <p>
            <a class="btn btn--primary" href="/">Ir al inicio</a>
          </p>
        </div>
      </div>
    </main>
    <site-footer></site-footer>
    <script type="module" src="/src/scripts/app.js"></script>
  </body>
</html>
